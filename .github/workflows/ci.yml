name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run automated tests
        run: pytest -m "not integration and not gui" --cov=. --cov-report=xml:coverage.xml | tee pytest.log

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            coverage.xml
            pytest.log

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint maintained test and helper scripts
        run: ruff check tests scripts/manual_tests list_models.py

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install detect-secrets
        run: python -m pip install detect-secrets

      - name: Scan tracked files for secrets
        run: |
          set -o pipefail
          # Allow only reviewed placeholder fields: empty API key/password values,
          # the LM Studio local placeholder key, and documented environment names.
          EXCLUDE_LINES='pragma: allowlist secret|^[[:space:]]*["'"'"']api_key["'"'"']:[[:space:]]*["'"'"'](|lm-studio)["'"'"']|^[[:space:]]*["'"'"']password["'"'"']:[[:space:]]*["'"'"'](|ZLIBRARY_PASSWORD)["'"'"']|BOOK_TRANSLATOR_ADMIN_PASSWORD|ZLIBRARY_PASSWORD'
          git ls-files -z | xargs -0 detect-secrets-hook --exclude-lines "$EXCLUDE_LINES" 2>&1 | tee detect-secrets.log

      - name: Upload detect-secrets log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detect-secrets-log
          path: detect-secrets.log
